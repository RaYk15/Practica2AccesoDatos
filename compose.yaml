name: p2-lol

services:
  postgres:
    image: postgres:18.6
    container_name: p2-lol-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lol}
      POSTGRES_USER: ${POSTGRES_USER:-lol}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD.}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - p2-lol-datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  p2-lol-datos:
